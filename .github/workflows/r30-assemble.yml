name: Assemble approved R30 source archive on isolated draft
on:
  push:
    branches:
      - draft/e1-r30-approved
permissions:
  contents: write
jobs:
  assemble-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and finalize exact R30 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .r30-tmp/part-* > source/ideology-sorter-source.zip
          echo '8fdd78da7b860ea1b659c4b9aa262d875504c3c28c5f55685878845b878138dc  source/ideology-sorter-source.zip' | sha256sum -c -
          rm -rf .r30-tmp
          rm .github/workflows/r30-assemble.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize exact approved E1-R30-national-socialism-20261116 source archive'
          git push origin HEAD:draft/e1-r30-approved
