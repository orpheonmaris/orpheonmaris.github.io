name: Assemble approved R29 archive on draft branch
on:
  push:
    branches:
      - draft/e1-r29-approved-staging
permissions:
  contents: write
jobs:
  assemble-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble, verify, and finalize source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .r29-tmp/part-* > source/ideology-sorter-source.zip
          echo '8d07b01b351966e4d69ade9de75734cf333e4b02bdbe57a68cdde8908a4995dd  source/ideology-sorter-source.zip' | sha256sum -c -
          rm -rf .r29-tmp
          rm .github/workflows/r29-assemble.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize approved E1-R29-9d0af24a9432 source archive'
          git push origin HEAD:draft/e1-r29-approved-staging
